# Standalone dsh-browser workspace: the bridge plugin and the Chrome extension install self-contained.
packages:
  - extensions/*
  - packages/*/*

# The DSH peer providers are provided explicitly by the workspace, all at the default
# release 0.2.2-rc.2; the bridge plugin declares a wider supported range, see docs/dsh-matrix.md.
autoInstallPeers: false

# The OpenTelemetry SDK's peer range requires an API below 1.10.0.
overrides:
  '@opentelemetry/api': 1.9.1

# The dsh runtime and the extension build depend on the install scripts of these trusted packages.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

# Pre-release @deepseek-ai packages need to be installable right after they are published.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
