name: DSH compatibility matrix

# Runs the bridge against DSH releases other than the workspace default.
# `tested` is the default release plus every other release the bridge lists as
# tested (TESTED_DSH_VERSIONS in packages/browser/bridge-browser/src/dsh-support.ts);
# that row must pass. `latest` and `next` are dist-tags that upstream moves and
# that may point outside the supported range (see docs/dsh-matrix.md for what
# they resolved to and how those releases did), so those rows report through
# the job summary and warnings without failing the workflow. The default
# release is also enforced by the gate that ci.yml runs (`pnpm gate`: its
# check-runtime and smoke-runtime steps).
#
# Like every workflow here, this one has never run: GitHub Actions is not
# available for this repository. The results that count are the ones a local
# run records in docs/dsh-matrix.md:
#   node scripts/dsh-matrix.mjs tested latest next --record

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of targets: "tested", "pin", dist-tags, or exact versions'
        required: false
        default: '["tested", "latest", "next"]'

permissions:
  contents: read

concurrency:
  group: dsh-matrix
  cancel-in-progress: true

jobs:
  matrix:
    name: DSH ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.target != 'pin' && matrix.target != 'tested' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets || '["tested", "latest", "next"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      # The default release runs in place against the committed lockfile, and
      # the script reads semver from that install; other releases install a
      # rewritten temp copy inside scripts/dsh-matrix.mjs.
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, unit tests and runtime smoke against DSH ${{ matrix.target }}
        run: node scripts/dsh-matrix.mjs "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
