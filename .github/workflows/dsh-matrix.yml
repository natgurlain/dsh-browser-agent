name: DSH compatibility matrix

# Probes the bridge against DSH releases other than the exact pin.
# Only the pin row can fail the workflow; latest/next rows report via the job
# summary and warnings. The pin itself is enforced by ci.yml / runtime.yml.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of targets: "pin", dist-tags, or exact versions'
        required: false
        default: '["pin", "latest", "next"]'

permissions:
  contents: read

concurrency:
  group: dsh-matrix
  cancel-in-progress: true

jobs:
  matrix:
    name: DSH ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.target != 'pin' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets || '["pin", "latest", "next"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      # The pin row runs in place against the committed lockfile; other rows
      # install a rewritten temp copy inside scripts/dsh-matrix.mjs.
      - if: matrix.target == 'pin'
        run: pnpm install --frozen-lockfile
      - name: Typecheck, unit tests and runtime smoke against DSH ${{ matrix.target }}
        run: node scripts/dsh-matrix.mjs "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
