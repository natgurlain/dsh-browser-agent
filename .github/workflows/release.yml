name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.5)'
        required: true
      draft:
        description: 'Create the GitHub Release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Untrusted-input half: install, test and package with a read-only token and
  # no OIDC token, so a compromised dependency or build script cannot publish,
  # sign provenance, or write to the repository.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # No dependency cache in the release job: build from a clean store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:runtime
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Build and package release assets
        run: node scripts/package-release.mjs --tag "$TAG" --out release --notes release-notes.md
      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      # The installers' release path against a local stand-in for GitHub Releases, and the
      # version/tag consistency checks. After packaging, which built the extension.
      - run: pnpm run test:scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  # Privileged half: runs no repository code. It only downloads the packaged
  # assets, re-verifies their checksums, attests them and publishes.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Verify checksums
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          # Every published file must be listed: the installers refuse an unlisted one.
          for file in *; do
            [ "$file" = SHA256SUMS ] || grep -q "  $file\$" SHA256SUMS || { echo "::error::$file is not in SHA256SUMS"; exit 1; }
          done
      - name: Attest build provenance
        # Artifact attestations need a public repo (or GitHub Enterprise Cloud).
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never overwrite published assets: upload fails if any already exists.
            gh release upload "$TAG" release/*
            exit 0
          fi
          flags=(--verify-tag --title "$TAG" --notes-file notes/release-notes.md)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if [[ "$DRAFT" == "true" ]]; then flags+=(--draft); fi
          gh release create "$TAG" release/* "${flags[@]}"
